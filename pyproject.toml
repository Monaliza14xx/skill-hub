[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-hub"
version = "1.0.0"
description = "Universal Skill and Plugin Hub for Multi-Agent AI Tools (AGY, Claude Code, ChatGPT/Codex, Kiro, etc.)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "AI Developer Team"}
]
keywords = ["ai-agents", "skills", "plugins", "claude-code", "antigravity", "codex", "kiro", "chatgpt"]

[project.scripts]
skill-hub = "skill_hub.cli:main"

[tool.setuptools.packages.find]
include = ["skill_hub*"]
